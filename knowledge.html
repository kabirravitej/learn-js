<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge — Learn JS</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="learn.css" />
    <style>
      .knowledge-page {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }

      .knowledge-page h1 {
        font-family: var(--font-display);
        letter-spacing: -0.03em;
      }

      .card-list {
        display: grid;
        gap: 0.85rem;
        margin-top: 1.5rem;
      }

      .card-list article {
        padding: 1rem 1.1rem;
        border-radius: 12px;
        background: var(--learn-panel);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .card-list h2 {
        margin: 0 0 0.4rem;
        font-family: var(--font-display);
        font-size: 1.1rem;
        color: var(--learn-active);
      }

      .card-list p {
        margin: 0;
        color: #d7ebe0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body class="learn-body">
    <div class="learn-app is-workspace">
      <nav class="learn-nav" aria-label="Primary">
        <a class="learn-brand" href="index.html">
          <img src="logo.png" alt="" width="820" height="841" />
          <span>Learn JS</span>
        </a>
        <a href="learn.html"
          ><span class="material-symbols-outlined" aria-hidden="true">home</span><span>Learn</span></a
        >
        <a href="workspace.html"
          ><span class="material-symbols-outlined" aria-hidden="true">terminal</span><span>Workspace</span></a
        >
        <a class="is-active" href="knowledge.html"
          ><span class="material-symbols-outlined" aria-hidden="true">style</span><span>Knowledge</span></a
        >
        <a href="index.html"
          ><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span><span>Home</span></a
        >
        <div class="account-menu">
          <button type="button" class="account-chip" id="account-chip" hidden aria-haspopup="menu" aria-expanded="false">
            <span class="material-symbols-outlined" aria-hidden="true">person</span>
            <span id="account-label">Account</span>
            <span class="material-symbols-outlined account-caret" aria-hidden="true">expand_more</span>
          </button>
          <div class="account-dropdown" id="account-dropdown" role="menu" hidden>
            <button type="button" data-account-settings role="menuitem">
              <span class="material-symbols-outlined" aria-hidden="true">settings</span> Settings
            </button>
            <button type="button" class="is-danger" data-account-logout role="menuitem">
              <span class="material-symbols-outlined" aria-hidden="true">logout</span> Log Out
            </button>
          </div>
        </div>
      </nav>

      <main class="knowledge-page">
        <h1>Knowledge cards</h1>
        <p style="color: var(--learn-muted)">Quick recaps from every lesson — skim these anytime.</p>
        <div class="card-list" id="card-list"></div>
      </main>
    </div>

    <script src="auth-client.js"></script>
    <script src="account-menu.js"></script>
    <script src="progress.js"></script>
    <script>
      (async () => {
        const user = await window.LearnJSAccountMenu.requireAndMount({ active: "knowledge" });
        if (!user) return;
        const list = document.getElementById("card-list");
        const cards = window.LearnJSProgress.load().knowledgeCards;
        if (!cards.length) {
          list.innerHTML =
            "<p style='color:var(--learn-muted)'>No cards yet. Finish a lesson on the path.</p>";
        } else {
          list.innerHTML = cards
            .map((c) => `<article><h2>${c.title}</h2><p>${c.body}</p></article>`)
            .join("");
        }
      })();
    </script>
  </body>
</html>
